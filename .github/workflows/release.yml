name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. v0.2.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    # Hoisted so the tap step can test for it — the secrets context isn't
    # available in a step-level `if`.
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install build tools
        run: brew install xcodegen create-dmg

      - name: Build
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild build \
            -project ClaudeUsage.xcodeproj \
            -scheme ClaudeUsage \
            -configuration Release \
            -derivedDataPath dd \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            | xcbeautify --renderer github-actions

      - name: Verify the bundle
        run: |
          set -euo pipefail
          APP="dd/Build/Products/Release/Claude Usage.app"
          test -d "$APP/Contents/PlugIns/ClaudeUsageWidget.appex"
          # The update check compares against this, so a wrong value means the
          # app either never notices a release or nags about one it already is.
          PLIST="$APP/Contents/Info.plist"
          STAMPED=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")
          test "$STAMPED" = "${{ steps.version.outputs.version }}" \
            || { echo "stamped $STAMPED, expected ${{ steps.version.outputs.version }}"; exit 1; }

      - name: Create DMG
        run: |
          set -euo pipefail
          mkdir -p dist
          # --skip-jenkins avoids the AppleScript window-positioning pass, which
          # needs a Finder that a headless runner does not have.
          create-dmg \
            --volname "Claude Usage" \
            --window-size 540 380 \
            --icon-size 110 \
            --icon "Claude Usage.app" 140 180 \
            --app-drop-link 400 180 \
            --skip-jenkins \
            "dist/ClaudeUsage-${{ steps.version.outputs.version }}.dmg" \
            "dd/Build/Products/Release/Claude Usage.app"

      - name: Checksum
        id: checksum
        run: |
          set -euo pipefail
          cd dist
          SHA=$(shasum -a 256 *.dmg | awk '{print $1}')
          shasum -a 256 *.dmg > SHA256SUMS.txt
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          ### Install

          ```sh
          brew tap saeedkolivand/tap
          brew install --cask claude-usage
          ```

          Or download the DMG below.

          This build is ad-hoc signed, not notarized, so macOS quarantines it.
          The cask clears that for you. If you install the DMG by hand, run:

          ```sh
          xattr -dr com.apple.quarantine "/Applications/Claude Usage.app"
          ```
          EOF
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file notes.md \
            dist/*.dmg dist/SHA256SUMS.txt

      # Skipped rather than failed when the secret is absent, so the release
      # still publishes and the cask can be updated by hand.
      - name: Update the Homebrew tap
        if: env.TAP_TOKEN != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.checksum.outputs.sha256 }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/saeedkolivand/homebrew-tap.git" tap
          mkdir -p tap/Casks
          sed -e "s/@VERSION@/${VERSION}/g" -e "s/@SHA256@/${SHA256}/g" \
            packaging/claude-usage.rb.tmpl > tap/Casks/claude-usage.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/claude-usage.rb
          git commit -m "claude-usage ${VERSION}"
          git push
