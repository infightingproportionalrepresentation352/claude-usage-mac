name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: UsageCore
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      # Proves the whole data path runs end to end on a machine with no Claude
      # Code install: no credentials and no ~/.claude/projects. Exit 1 with
      # "no-token" is the correct outcome here, so only a crash fails the step.
      - name: Smoke test the CLI
        run: |
          set -o pipefail
          swift run usage-cli --json | tee /tmp/snapshot.json || true
          python3 -c "import json;json.load(open('/tmp/snapshot.json'))"

  app:
    name: App + Widget
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install xcodegen xcbeautify

      - name: Generate project
        run: xcodegen generate

      - name: Build app and widget
        run: |
          xcodebuild build \
            -project ClaudeUsage.xcodeproj \
            -scheme ClaudeUsage \
            -configuration Release \
            -destination 'platform=macOS' \
            CONFIGURATION_BUILD_DIR="$PWD/build" \
            | xcbeautify --renderer github-actions || exit "${PIPESTATUS[0]}"

      # The only way to actually look at the UI from a Windows dev machine.
      - name: Render snapshots
        run: |
          xcodebuild test \
            -project ClaudeUsage.xcodeproj \
            -scheme SnapshotTests \
            -destination 'platform=macOS' \
            | xcbeautify --renderer github-actions || exit "${PIPESTATUS[0]}"

      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: snapshots/
          if-no-files-found: error

      - name: Package the app
        run: |
          cd build
          zip -qry ../ClaudeUsage.zip "Claude Usage.app"

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeUsage-app
          path: ClaudeUsage.zip
