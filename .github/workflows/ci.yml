name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: UsageCore
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      # Proves the whole data path runs end to end on a machine with no Claude
      # Code install: no credentials and no ~/.claude/projects. Exit 1 with
      # "no-token" is the correct outcome here, so only a crash fails the step.
      - name: Smoke test the CLI
        run: |
          set -o pipefail
          swift run usage-cli --json | tee /tmp/snapshot.json || true
          python3 -c "import json;json.load(open('/tmp/snapshot.json'))"

  app:
    name: App + Widget
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: brew install xcodegen xcbeautify

      - name: Generate project
        run: xcodegen generate

      - name: Build app and widget
        run: |
          set -o pipefail
          xcodebuild build \
            -project ClaudeUsage.xcodeproj \
            -scheme ClaudeUsage \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath dd \
            | xcbeautify --renderer github-actions

      # The only way to actually look at the UI from a Windows dev machine.
      - name: Render snapshots
        run: |
          set -o pipefail
          xcodebuild test \
            -project ClaudeUsage.xcodeproj \
            -scheme SnapshotTests \
            -destination 'platform=macOS' \
            | xcbeautify --renderer github-actions

      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: snapshots
          path: snapshots/
          if-no-files-found: error

      - name: Package the app
        run: |
          set -euo pipefail
          APP="dd/Build/Products/Release/Claude Usage.app"

          # Without a Mac to check on, this is the only confirmation that the
          # extension actually embedded and that both entitlements applied.
          test -d "$APP/Contents/PlugIns/ClaudeUsageWidget.appex" \
            || { echo "widget did not embed"; ls -R "$APP/Contents"; exit 1; }

          # A missing icon should fail the build, not ship as a blank square in
          # the widget gallery.
          test -f "$APP/Contents/Resources/Assets.car" \
            || { echo "asset catalog missing — no app icon"; exit 1; }
          assetutil --info "$APP/Contents/Resources/Assets.car" \
            | grep -q AppIcon || { echo "Assets.car has no AppIcon"; exit 1; }
          codesign -dv --entitlements - "$APP" 2>&1 | tail -20
          codesign -dv --entitlements - "$APP/Contents/PlugIns/ClaudeUsageWidget.appex" 2>&1 | tail -20

          ditto -c -k --keepParent "$APP" ClaudeUsage.zip

      - uses: actions/upload-artifact@v7
        with:
          name: ClaudeUsage-app
          path: ClaudeUsage.zip
