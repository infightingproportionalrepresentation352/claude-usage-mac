name: Stats

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

# One writer at a time, so a manual run during the nightly one can't race it.
concurrency: stats

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Collect counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # --slurp so a second page of releases can't emit a second total.
          # It can't be combined with --jq, hence the pipe.
          # Only .dmg assets: the checksum file is not an install.
          downloads=$(gh api --paginate --slurp "repos/${{ github.repository }}/releases" \
            | jq '[.[][].assets[] | select(.name | endswith(".dmg")) | .download_count] | add // 0')
          stars=$(gh api "repos/${{ github.repository }}" --jq .stargazers_count)
          jq -n --argjson d "$downloads" --argjson s "$stars" \
            '{downloads: $d, stars: $s}' > docs/stats.json
          cat docs/stats.json

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/stats.json
          git diff --cached --quiet || git commit -m "Update stats"
          git push
